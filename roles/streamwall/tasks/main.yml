---
- name: Set timezone to America/Los_Angeles
  timezone:
    name: America/Los_Angeles

- name: Create streamwall user
  user:
    name: streamwall
    home: /home/streamwall

- name: Create systemd user service directory
  file:
    path: "{{ user_service_dir }}"
    state: directory
    owner: streamwall
    group: streamwall

- name: Setup X server
  import_tasks: xserver.yml
  tags: xserver

- name: Setup compton
  import_tasks: compton.yml
  tags: compton

- name: Setup streamcapture
  import_tasks: streamcapture.yml
  tags: streamcapture

- name: Setup streamwall
  import_tasks: streamwall.yml
  tags: streamwall

- name: Setup streamdelay
  import_tasks: streamdelay.yml
  tags: streamdelay

- name: Setup rtmp outputs
  import_tasks: rtmpoutput.yml
  tags: rtmpoutput

- name: Setup HLS output
  import_tasks: hlsoutput.yml
  tags: hlsoutput

- name: Setup stream content
  import_tasks: content.yml
  tags: content

- name: Setup caddy
  import_tasks: caddy.yml
  tags: caddy

- name: Setup vnc
  import_tasks: vnc.yml
  tags: vnc

- name: Add stream target service file
  copy:
    src: stream.target
    dest: "{{ user_service_dir }}/stream.target"
    owner: streamwall
    group: streamwall
  notify:
    - Reload user systemd
    - Start stream
